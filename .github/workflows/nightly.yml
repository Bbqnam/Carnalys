name: Nightly market sync

# Keeps the database honest off the request path: Vercel's free plan kills
# functions at 60s, which is enough to pull new listings but never enough to
# finish a removal sweep. This job has no such limit.
#
# Runs ~03:00–04:00 Europe/Stockholm (before the 06:00/07:00 UTC report cron).
# Also runnable by hand from the Actions tab.
#
# Required repository secrets:
#   DATABASE_URL   pooled Postgres connection string (Neon)
#   DIRECT_URL     direct (unpooled) Postgres connection string
# Optional:
#   BLOCKET_UNOFFICIAL_API_URL   defaults to https://blocket-api.se

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      poll_limit:
        description: "How many listings the Blocket removal poll checks this run"
        default: "12000"
        required: false

concurrency:
  group: nightly-market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BLOCKET_UNOFFICIAL_API_URL: ${{ secrets.BLOCKET_UNOFFICIAL_API_URL || 'https://blocket-api.se' }}
      BLOCKET_POLL_LIMIT: ${{ github.event.inputs.poll_limit || '12000' }}
      BLOCKET_POLL_CONCURRENCY: "15"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # --- additions: newest-first incremental refresh, one step per source so
      #     one source being down does not block the others or the removal poll.
      - name: Sync Blocket (incremental)
        continue-on-error: true
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental
      - name: Sync Wayke (incremental)
        continue-on-error: true
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=wayke
      - name: Sync Bytbil (incremental)
        continue-on-error: true
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=bytbil
      - name: Sync Hedin (incremental)
        continue-on-error: true
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=hedin
      - name: Sync Autohero (incremental)
        continue-on-error: true
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=autohero

      # --- removals: the layered availability poll (API 404 + real ad page
      #     "sold or removed" notice). Rotates oldest-checked-first, so ~2 weeks
      #     of nightly runs at this limit cover the whole active Blocket set.
      - name: Poll Blocket for removals
        run: npm run data:poll

      # Original-host evidence for the other sources. Rotate the oldest checks;
      # 403/429 stop that source's batch instead of pretending adverts are gone.
      # Recommendations also verify their own bounded candidate set on demand.
      - name: Verify non-Blocket adverts on their original sites
        continue-on-error: true
        run: |
          npm run data:availability:write -- --source=wayke --limit=500
          npm run data:availability:write -- --source=bytbil --limit=500
          npm run data:availability:write -- --source=hedin --limit=500
          npm run data:availability:write -- --source=autohero --limit=500

      - name: Freeze the next forward-validation snapshot
        run: npm run valuation:freeze -- "artifacts/valuation/snapshot-${GITHUB_RUN_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: valuation-snapshot-${{ github.run_id }}
          path: artifacts/valuation/snapshot-*.json
          retention-days: 30

      # --- sanity: the report query still runs against the live schema.
      - name: Daily report smoke test
        run: npm run report:smoke

  # Independent runtime budget: valuation work must not be cut short by a
  # slow source sync. Bounded backlog draining, never on a page request.
  analyze:
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Drain pending and expired valuations
        run: npm run data:analyze -- 50000
