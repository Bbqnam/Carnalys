name: Catalogue update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalogue-update.yml
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        source: [blocket, wayke, bytbil, hedin, autohero]
    concurrency:
      group: catalogue-source-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BLOCKET_UNOFFICIAL_API_URL: ${{ secrets.BLOCKET_UNOFFICIAL_API_URL || 'https://blocket-api.se' }}
      BLOCKET_INCREMENTAL_LOOKBACK_HOURS: "30"
      SYNC_RECOVERY_HOURS: ${{ github.event_name == 'push' && '48' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Import all listings since the last covered update
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=${{ matrix.source }} --catch-up
