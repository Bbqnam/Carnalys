name: Wayke listing recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wayke-sync.yml
      - src/infrastructure/marketplaces/wayke/**

concurrency:
  group: wayke-listing-recovery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BLOCKET_INCREMENTAL_LOOKBACK_HOURS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test the Wayke importer
        run: node --import tsx --test src/infrastructure/marketplaces/wayke/*.test.ts
      - name: Import Wayke listings
        run: npx tsx src/scripts/sync-vehicle-listings.ts incremental --source=wayke --catch-up
